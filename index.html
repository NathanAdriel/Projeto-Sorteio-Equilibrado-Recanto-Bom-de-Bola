<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniValidade</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --azul-royal: #0A42D9;
    --azul-claro: #4A63E7;
    --fundo: #F5F7FF;
    --card: #FFFFFF;
    --texto: #1A1A2E;
    --cinza: #8A8FA3;
    --vermelho: #E53935;
    --amarelo: #FFB300;
    --verde: #43A047;
    --sombra: 0 4px 16px rgba(10, 66, 217, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: var(--fundo); color: var(--texto); padding-bottom: 90px; min-height: 100vh; }
  h1, h2, h3 { font-family: 'Poppins', sans-serif; }

  .tela { display: none; padding: 20px; }
  .tela.ativa { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .login-wrap { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 24px; }
  .logo-container { text-align: center; margin-bottom: 32px; }
  .logo-container img { width: 100%; max-width: 320px; height: auto; margin: 0 auto 16px; display: block; }
  .logo-container p { color: var(--cinza); font-size: 14px; margin-top: -8px; }

  .campo { margin-bottom: 16px; }
  .campo label { display: block; font-size: 13px; font-weight: 600; color: var(--texto); margin-bottom: 6px; }
  .campo input { width: 100%; padding: 14px 16px; border: 2px solid #E4E8F5; border-radius: 14px; font-size: 15px; font-family: inherit; background: var(--card); transition: .2s; }
  .campo input:focus { outline: none; border-color: var(--azul-royal); box-shadow: 0 0 0 4px rgba(10, 66, 217, .1); }

  .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--azul-royal), var(--azul-claro)); color: white; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; transition: .2s; box-shadow: 0 6px 16px rgba(10, 66, 217, .25); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { background: #A0AABF; box-shadow: none; cursor: not-allowed; }

  .top-header { display: flex; align-items: center; margin-bottom: 24px; gap: 12px; }
  .top-header img { height: 40px; width: auto; object-fit: contain; }
  .header { margin-bottom: 20px; }
  .header h2 { font-size: 22px; }
  .header .sub { color: var(--cinza); font-size: 13px; margin-top: 2px; }

  .resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
  .card-resumo { background: var(--card); border-radius: 16px; padding: 14px 8px; text-align: center; box-shadow: var(--sombra); }
  .card-resumo .num { font-family: 'Poppins'; font-size: 22px; font-weight: 700; }
  .card-resumo .lbl { font-size: 11px; color: var(--cinza); margin-top: 2px; font-weight: 600;}
  .card-resumo.bpc .num { color: #8E24AA; }
  .card-resumo.hc .num { color: #2196F3; }
  .card-resumo.nt .num { color: #FF9800; }

  .produto { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: var(--sombra); display: flex; gap: 14px; align-items: flex-start; border-left: 5px solid var(--verde); position: relative; }
  .produto.alerta { border-left-color: var(--amarelo); }
  .produto.vencido { border-left-color: var(--vermelho); }
  .produto img { width: 58px; height: 58px; border-radius: 12px; object-fit: cover; background: #EEF1FB; flex-shrink: 0; }
  .produto .info { flex: 1; min-width: 0; padding-right: 24px; }
  .produto .nome { font-weight: 600; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .produto .qtd-tag { display: inline-block; background: #EEF1FB; color: var(--azul-royal); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid #D0D9F2; }
  .produto .cat { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-left: 6px; }
  .cat.BPC { background: #F3E5F5; color: #8E24AA; }
  .cat.HC { background: #E3F2FD; color: #2196F3; }
  .cat.NT { background: #FFF3E0; color: #FF9800; }
  .produto .dias { font-size: 12px; font-weight: 600; margin-top: 4px;}
  .produto .dias.ok { color: var(--verde); }
  .produto .dias.alerta { color: var(--amarelo); }
  .produto .dias.vencido { color: var(--vermelho); }
  .produto .data { font-size: 11px; color: var(--cinza); margin-top: 2px; }
  .produto .del { position: absolute; top: 10px; right: 10px; background: #FFEBEE; border: none; color: var(--vermelho); width: 28px; height: 28px; border-radius: 8px; font-size: 16px; cursor: pointer; }

  .vazio { text-align: center; padding: 60px 20px; color: var(--cinza); }
  .vazio .emoji { font-size: 48px; margin-bottom: 12px; }

  .fab { position: fixed; bottom: 90px; right: 20px; width: 60px; height: 60px; border-radius: 20px; border: none; background: linear-gradient(135deg, var(--azul-royal), var(--azul-claro)); color: white; font-size: 30px; cursor: pointer; box-shadow: 0 8px 20px rgba(10, 66, 217, .4); display: none; align-items: center; justify-content: center; transition: .2s; z-index: 50; }
  .fab:active { transform: scale(.9); }

  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: none; padding: 10px 0 14px; box-shadow: 0 -4px 16px rgba(0,0,0,.05); z-index: 10; }
  .nav button { flex: 1; background: none; border: none; font-family: inherit; font-size: 11px; color: var(--cinza); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .nav button .icone { font-size: 20px; }
  .nav button.ativo { color: var(--azul-royal); font-weight: 600; }

  .modal-bg { position: fixed; inset: 0; background: rgba(20,25,50,.5); display: none; align-items: flex-end; z-index: 100; }
  .modal-bg.aberto { display: flex; }
  .modal { background: var(--card); width: 100%; border-radius: 24px 24px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; animation: slideUp .3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
  .modal h3 { font-size: 19px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
  .modal .fechar { background: #F0F2FA; border: none; width: 32px; height: 32px; border-radius: 10px; font-size: 18px; cursor: pointer; }

  .upload-img { width: 100%; height: 120px; border: 2px dashed #C9D0E8; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--cinza); font-size: 13px; background: #FAFBFF; overflow: hidden; position: relative; }
  .upload-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .upload-img input { display: none; }

  .grupo-cats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .cat-btn { padding: 12px 6px; border: 2px solid #E4E8F5; background: var(--card); border-radius: 12px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: .2s; }
  .cat-btn.sel { border-color: var(--azul-royal); background: #EEF1FF; color: var(--azul-royal); }

  .qtd-container { display: flex; align-items: center; background: #FAFBFF; border: 2px solid #E4E8F5; border-radius: 14px; overflow: hidden; height: 50px;}
  .qtd-btn { width: 50px; height: 100%; border: none; background: #EEF1FF; color: var(--azul-royal); font-size: 24px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qtd-btn:active { background: #D0D9F2; }
  .qtd-input { flex: 1; text-align: center; border: none; background: transparent; font-size: 18px; font-weight: 700; font-family: 'Poppins', sans-serif; color: var(--texto); -moz-appearance: textfield;}
  .qtd-input::-webkit-outer-spin-button, .qtd-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qtd-input:focus { outline: none; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--verde); color: white; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 200; transition: .3s; box-shadow: 0 8px 20px rgba(67,160,71,.3); }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="telaLogin" class="tela ativa">
  <div class="login-wrap">
    <div class="logo-container">
      <img src="logo.png" alt="UniValidade Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
      <h1 style="display:none; color:var(--azul-royal); font-size:32px; margin-bottom:16px;">UniValidade</h1>
      <p>Controle de validade dos produtos</p>
    </div>
    <div class="campo"><label>Nome do Promotor</label><input id="inNome" placeholder="Ex: João Silva"></div>
    <div class="campo"><label>Loja</label><input id="inLoja" placeholder="Ex: Supermercado Bom Preço"></div>
    <div class="campo"><label>Cidade</label><input id="inCidade" placeholder="Ex: São Paulo"></div>
    <button class="btn" id="btnEntrar" disabled onclick="entrar()">⏳ Carregando sistema...</button>
  </div>
</div>

<div id="telaDash" class="tela">
  <div class="top-header">
    <img src="logo.png" alt="UniValidade" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
    <h2 style="display:none; color:var(--azul-royal);">UniValidade</h2>
  </div>

  <div class="header">
    <h2>Olá, <span id="saudNome">Promotor</span> 👋</h2>
    <p class="sub" id="saudLoja">—</p>
  </div>

  <div class="resumo">
    <div class="card-resumo bpc"><div class="num" id="countBPC">0</div><div class="lbl">Perfumaria</div></div>
    <div class="card-resumo hc"><div class="num" id="countHC">0</div><div class="lbl">Home Care</div></div>
    <div class="card-resumo nt"><div class="num" id="countNT">0</div><div class="lbl">Nutrition</div></div>
  </div>

  <div class="header" style="margin-bottom:12px"><h2 style="font-size:17px">Produtos cadastrados</h2></div>
  <div id="listaProdutos"></div>
</div>

<button class="fab" id="fab" onclick="abrirModal()" style="display:none">+</button>

<div class="nav" id="nav" style="display:none">
  <button class="ativo"><span class="icone">🏠</span> Início</button>
  <button onclick="sair()"><span class="icone">🚪</span> Sair</button>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Novo Produto <button class="fechar" onclick="fecharModal()">✕</button></h3>

    <div class="campo">
      <label>Imagem do Produto</label>
      <label class="upload-img" id="uploadBox">
        <input type="file" accept="image/*" capture="environment" id="inImagem" onchange="previewImg(event)">
        <span style="font-size:28px">📷</span>
        <span id="uploadTxt">Toque para tirar/escolher foto</span>
      </label>
    </div>

    <div class="campo"><label>Nome do Produto</label><input id="inProduto" placeholder="Ex: Maionese Hellmann's 500g"></div>
    <div class="campo"><label>Marca</label><input id="inMarca" placeholder="Ex: Hellmann's"></div>

    <div class="campo">
      <label>Categoria</label>
      <div class="grupo-cats">
        <button type="button" class="cat-btn" data-cat="BPC" onclick="selCat(this)">BPC</button>
        <button type="button" class="cat-btn" data-cat="HC" onclick="selCat(this)">HC</button>
        <button type="button" class="cat-btn" data-cat="NT" onclick="selCat(this)">NT</button>
      </div>
    </div>

    <div class="campo">
      <label>Quantidade em Estoque</label>
      <div class="qtd-container">
        <button type="button" class="qtd-btn" onclick="mudarQtd(-1)">−</button>
        <input type="number" id="inQtd" class="qtd-input" value="1" min="1">
        <button type="button" class="qtd-btn" onclick="mudarQtd(1)">+</button>
      </div>
    </div>

    <div class="campo">
      <label>Data de Validade</label>
      <input type="date" id="inValidade">
    </div>

    <button class="btn" onclick="salvarProduto()" style="margin-top: 10px;">💾 Salvar Produto</button>
  </div>
</div>

<div class="toast" id="toast">✓ Produto salvo!</div>

<script>
var db;
var promotor = null;
var produtos = [];
var categoriaSelecionada = null;
var imagemBase64 = null;

var request = indexedDB.open('UniValidadeDB', 1);

request.onupgradeneeded = function(e) {
  db = e.target.result;
  if (!db.objectStoreNames.contains('produtos')) {
    db.createObjectStore('produtos', { keyPath: 'id' });
  }
};

request.onsuccess = function(e) {
  db = e.target.result;
  var btn = document.getElementById('btnEntrar');
  btn.disabled = false;
  btn.textContent = 'Entrar no Sistema →';
  
  try {
    var salvo = localStorage.getItem('univalidade_promotor');
    if (salvo) {
      promotor = JSON.parse(salvo);
      document.getElementById('inNome').value = promotor.nome;
      document.getElementById('inLoja').value = promotor.loja;
      document.getElementById('inCidade').value = promotor.cidade;
      entrar();
    }
  } catch(err) {}
};

function entrar() {
  var nome = document.getElementById('inNome').value.trim();
  var loja = document.getElementById('inLoja').value.trim();
  var cidade = document.getElementById('inCidade').value.trim();
  
  if (!nome || !loja || !cidade) { 
    mostrarToast('Preencha todos os campos', '#E53935'); 
    return; 
  }

  promotor = { nome: nome, loja: loja, cidade: cidade };
  localStorage.setItem('univalidade_promotor', JSON.stringify(promotor));
  
  document.getElementById('saudNome').textContent = nome.split(' ')[0];
  document.getElementById('saudLoja').textContent = loja + ' • ' + cidade;
  
  document.getElementById('telaLogin').classList.remove('ativa');
  document.getElementById('telaDash').classList.add('ativa');
  document.getElementById('fab').style.display = 'flex';
  document.getElementById('nav').style.display = 'flex';
  
  carregarProdutos();
}

function sair() { 
  localStorage.removeItem('univalidade_promotor'); 
  location.reload(); 
}

function abrirModal() {
  document.getElementById('modalBg').classList.add('aberto');
  document.getElementById('inProduto').value = '';
  document.getElementById('inMarca').value = '';
  document.getElementById('inValidade').value = '';
  document.getElementById('inQtd').value = '1';
  document.getElementById('inImagem').value = '';
  document.getElementById('uploadTxt').textContent = 'Toque para tirar/escolher foto';
  document.getElementById('uploadTxt').style.display = 'block';
  
  document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('sel'); });
  
  var box = document.getElementById('uploadBox');
  var imgAntiga = box.querySelector('img');
  if (imgAntiga) imgAntiga.remove();
  
  categoriaSelecionada = null;
  imagemBase64 = null;
}

function fecharModal() { 
  document.getElementById('modalBg').classList.remove('aberto'); 
}

function selCat(btn) {
  document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('sel'); });
  btn.classList.add('sel');
  categoriaSelecionada = btn.dataset.cat;
}

function mudarQtd(valor) {
  var input = document.getElementById('inQtd');
  var atual = parseInt(input.value) || 1;
  atual += valor;
  if (atual < 1) atual = 1;
  input.value = atual;
}

// ====== AQUI ESTÁ A MÁGICA DA VELOCIDADE ======
function previewImg(e) {
  var file = e.target.files[0];
  if (!file) return;
  
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      // Cria um canvas invisível para redimensionar a foto
      var canvas = document.createElement('canvas');
      var MAX_WIDTH = 400; // Reduz a foto para no máximo 400px de largura
      var width = img.width;
      var height = img.height;

      if (width > MAX_WIDTH) {
        height = Math.round((height * MAX_WIDTH) / width);
        width = MAX_WIDTH;
      }

      canvas.width = width;
      canvas.height = height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      // Converte a foto pequena em texto Base64 (agora ocupa apenas alguns KB)
      imagemBase64 = canvas.toDataURL('image/jpeg', 0.7); // 0.7 é a qualidade (70%)

      // Mostra a foto no quadradinho de upload
      var box = document.getElementById('uploadBox');
      var imgPreview = box.querySelector('img');
      if (!imgPreview) { 
        imgPreview = document.createElement('img'); 
        box.appendChild(imgPreview); 
      }
      imgPreview.src = imagemBase64;
      document.getElementById('uploadTxt').style.display = 'none';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
// ============================================

function salvarProduto() {
  var nome = document.getElementById('inProduto').value.trim();
  var marca = document.getElementById('inMarca').value.trim();
  var qtd = document.getElementById('inQtd').value;
  var validade = document.getElementById('inValidade').value;

  if (!nome || !validade || !categoriaSelecionada || !qtd) {
    mostrarToast('Preencha nome, categoria, qtd e validade', '#E53935');
    return;
  }

  var novo = {
    id: Date.now().toString(),
    nome: nome, 
    marca: marca,
    categoria: categoriaSelecionada,
    quantidade: parseInt(qtd),
    validade: validade,
    imagem: imagemBase64,
    promotor: promotor.nome,
    loja: promotor.loja,
    cidade: promotor.cidade
  };

  var tx = db.transaction(['produtos'], 'readwrite');
  var store = tx.objectStore('produtos');
  var req = store.put(novo);
  
  req.onsuccess = function() {
    fecharModal();
    mostrarToast('✓ Produto cadastrado!');
    carregarProdutos();
  };
}

function carregarProdutos() {
  var tx = db.transaction(['produtos'], 'readonly');
  var store = tx.objectStore('produtos');
  var req = store.getAll();
  
  req.onsuccess = function() {
    produtos = req.result || [];
    renderizar();
  };
}

function diasRestantes(dataValidade) {
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var alvo = new Date(dataValidade + 'T00:00:00');
  return Math.ceil((alvo - hoje) / (1000 * 60 * 60 * 24));
}

function classeDias(dias) {
  if (dias < 0) return 'vencido';
  if (dias <= 30) return 'alerta';
  return 'ok';
}

function textoDias(dias) {
  if (dias < 0) return '⚠️ Vencido há ' + Math.abs(dias) + ' dia(s)';
  if (dias === 0) return '⚠️ Vence hoje!';
  if (dias === 1) return 'Vence amanhã';
  return 'Faltam ' + dias + ' dias';
}

function renderizar() {
  var lista = document.getElementById('listaProdutos');
  if (!promotor) return;

  var meus = produtos.filter(function(p) { return p.promotor === promotor.nome; });

  document.getElementById('countBPC').textContent = meus.filter(function(p) { return p.categoria === 'BPC'; }).length;
  document.getElementById('countHC').textContent = meus.filter(function(p) { return p.categoria === 'HC'; }).length;
  document.getElementById('countNT').textContent = meus.filter(function(p) { return p.categoria === 'NT'; }).length;

  if (meus.length === 0) {
    lista.innerHTML = '<div class="vazio"><div class="emoji">📦</div><p>Nenhum produto cadastrado ainda.</p><p style="font-size:13px;margin-top:6px">Toque no botão <b>+</b> para começar</p></div>';
    return;
  }

  meus.sort(function(a, b) {
    var dataA = new Date(a.validade).getTime() || 0;
    var dataB = new Date(b.validade).getTime() || 0;
    return dataA - dataB;
  });

  lista.innerHTML = meus.map(function(p) {
    var dias = diasRestantes(p.validade);
    var cls = classeDias(dias);
    var dataFmt = new Date(p.validade + 'T00:00:00').toLocaleDateString('pt-BR');
    var qtd = p.quantidade || 1; 
    
    return '<div class="produto ' + cls + '">' +
      (p.imagem ? '<img src="' + p.imagem + '" alt="">' : '<div style="widt
